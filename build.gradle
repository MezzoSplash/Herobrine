plugins { id 'java' }
group = 'nl.meneertjes'
version = '1.0.0'
repositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
dependencies { compileOnly 'io.papermc.paper:paper-api:26.3.build.181-stable' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources { filesMatching('plugin.yml') { expand(version: version) } }
